<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Smart Calculator Pro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3c72">

<link rel="icon" href="icons/icon-192.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <h1>🧮 Smart Calculator Pro</h1>

            <p>Calculadora Inteligente para Empresas</p>
             <button id="btnTema" class="btnTema">
    🌙 Modo Escuro
</button>
        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        <div class="container">

            <section class="calculadora">

                <h2>Calculadora</h2>

                <label>Número 1</label>

                <input
                    type="number"
                    id="numero1"
                    placeholder="Digite o primeiro número">

                <label>Número 2</label>

                <input
                    type="number"
                    id="numero2"
                    placeholder="Digite o segundo número">

                <label>Resultado</label>

                <input
                    type="text"
                    id="resultado"
                    readonly
                    placeholder="Resultado aparecerá aqui">

                <div class="botoes">

                    <button id="somar">+</button>

                    <button id="subtrair">−</button>

                    <button id="multiplicar">×</button>

                    <button id="dividir">÷</button>

                </div>

                <div class="acoes">

    <button class="limpar" id="limpar">
        Limpar
    </button>

    <button class="copiar" id="copiar">
        📋 Copiar Resultado
    </button>

</div>

             
            </section>

            <!-- HISTÓRICO -->

            <section class="historico">

                <h2>Histórico</h2>

                <input
    type="text"
    id="pesquisarHistorico"
    placeholder="🔎 Pesquisar operação...">

                <div id="listaHistorico">

                    <p>Nenhuma operação realizada.</p>

                </div>

                <button id="btnLimparHistorico" class="btnHistorico">
                    🗑 Limpar Histórico
                </button>

            </section>

            <!-- ================= DASHBOARD ================= -->

<section class="dashboard">

    <h2>📊 Estatísticas</h2>


    <div class="cards">


        <div class="card">

            <h3>Total de Cálculos</h3>

            <p id="totalCalculos">
                0
            </p>

        </div>



        <div class="card">

            <h3>Operação Mais Usada</h3>

            <p id="operacaoMaisUsada">
                Nenhuma
            </p>

        </div>



        <div class="card">

            <h3>Último Cálculo</h3>

            <p id="ultimoCalculo">
                Nenhum
            </p>

        </div>


    </div>


</section>

        </div>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Smart Solutions

        </p>

        <p>

            Versão 1.0.0

        </p>

        <p>

            Desenvolvido por Davi F. Silva

        </p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
